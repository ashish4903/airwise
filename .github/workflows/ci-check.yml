name: ci-check (fork only, not part of the PR)

on:
  push:
    branches: [ci-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  location:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the fixed version
        run: npx vite build --outDir dist-fix --base /airwise/
      - name: Build the original version
        run: |
          git checkout cca0187 -- src
          npx vite build --outDir dist-orig --base /airwise/
          git checkout HEAD -- src
      - name: Serve both
        run: |
          mkdir -p site-fix/airwise site-orig/airwise
          cp -r dist-fix/. site-fix/airwise/
          cp -r dist-orig/. site-orig/airwise/
          (cd site-fix && python3 -m http.server 4173 > /dev/null 2>&1 &)
          (cd site-orig && python3 -m http.server 4174 > /dev/null 2>&1 &)
          sleep 2
      - name: "Use my location: fake places, Nominatim reachable and blocked"
        run: |
          CHROME=$(which google-chrome || which chromium)
          for build in "orig 4174" "fix 4173"; do
            set -- $build
            for place in "pune 18.5204 73.8567" "union-city 40.7555 -74.0392" "yavatmal 20.3899 78.1307"; do
              set -- $1 $2 $place
              for blocked in "" 1; do
                echo "===== build=$1 place=$3 nominatim=${blocked:+blocked}${blocked:-ok}"
                BLOCK_NOMINATIM=$blocked node ci-check/check.mjs "$CHROME" "/tmp/prof-$1-$3-$blocked" "/tmp/$1-$3.png" "http://127.0.0.1:$2/airwise/" $4 $5 | grep -E "after 15s|button" | sed 's/Pune city · 12-area average.*Yerawada, Pune | //'
              done
            done
          done
